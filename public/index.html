<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090e">
<meta name="description" content="Join the waitlist for launch updates on government tender and technology services.">
<title>Join the waitlist</title>
<style>
:root {
  font-family: system-ui, sans-serif;
  color: #f7f5fb;
  background: #09090e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
.stage {
  position: relative;
  isolation: isolate;
  display: grid;
  justify-items: center;
  overflow: hidden;
  min-height: max(100svh, 660px);
  background: #09080e;
}
main {
  width: min(100% - 40px, 720px);
  align-self: start;
  margin-top: clamp(72px, 15svh, 185px);
  padding-bottom: 130px;
  text-align: center;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 19px;
  padding: 5px 11px;
  border: 1px solid #c8b6ff29;
  border-radius: 999px;
  background: #1b1725;
  color: #e4d9fa;
  font-size: .875rem;
}
.eyebrow::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #c9adff;
  box-shadow: 0 0 9px #b892ff;
}
h1 {
  margin: 0;
  font-size: clamp(3.1rem, 7.1vw, 7rem);
  font-weight: 550;
  letter-spacing: -.065em;
  line-height: 1.01;
}
h1 em {
  font: italic 400 1.09em/.95 Georgia, serif;
  letter-spacing: -.055em;
  color: #e0d3ff;
}
@supports (background-clip: text) {
  h1 em {
    background: linear-gradient(105deg, #e0d3ff 32%, #fff 50%, #e0d3ff 68%) 100% 50% / 240% 100%;
    background-clip: text;
    color: transparent;
  }
  @media (prefers-reduced-motion: no-preference) {
    h1 em { animation: shimmer 5.8s ease-in-out infinite; }
  }
}
@keyframes shimmer { 0%, 18% { background-position: 100% 50%; } 65%, 100% { background-position: 0% 50%; } }
.description {
  max-width: 560px;
  margin: 23px auto 32px;
  color: #d3cbdc;
  font-size: 1rem;
  line-height: 1.55;
  text-wrap: balance;
}
form { max-width: 540px; margin-inline: auto; }
.row {
  display: flex;
  align-items: stretch;
  gap: 5px;
  padding: 4px;
  border: 1px solid #c8b6ff36;
  border-radius: 8px;
  background: #100e17;
  box-shadow: 0 8px 30px #08070d6b;
}
.row:focus-within { border-color: #a38bd7; }
input, button {
  min-height: 45px;
  padding: 10px 13px;
  border: 0;
  border-radius: 5px;
  font: inherit;
}
input { min-width: 0; flex: 1; background: transparent; color: #fff; }
input::placeholder { color: #bdb4cb; }
.row button { background: #f2ebff; color: #201732; font-weight: 650; cursor: pointer; }
.row button:hover { background: #e0ceff; }
.row button:disabled { opacity: .75; cursor: wait; }
.row button[data-status="error"] { background: #ffd6df; }
:focus-visible { outline: 2px solid #cdb2ff; outline-offset: 2px; }
.note { color: #ddd4ed; margin: 12px 0 0; font-size: .875rem; line-height: 1.5; }
 .planet {
  position: absolute;
  z-index: -1;
  inset: 0;
  pointer-events: none;
}
.planet img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 64%;
}
@media (max-width: 600px) {
  main { margin-top: clamp(70px, 12svh, 112px); }
  h1 { line-height: .99; }
  h1 em { display: block; }
  .description { margin: 20px auto 24px; }
  .planet {
    top: 33%;
    mask-image: linear-gradient(transparent, black 27%);
  }
  .planet img { object-position: center bottom; }
  .row button { font-size: .875rem; padding-inline: 10px; }
  input { padding-inline: 9px; }
}
@media (max-width: 355px) {
  .row { flex-direction: column; }
  .row button { align-self: stretch; }
}

.earth {
  position: absolute;
  top: max(54%, 365px);
  left: 50%;
  width: min(105vw, 1180px);
  aspect-ratio: 1;
  transform: translateX(-50%);
  isolation: isolate;
  opacity: 0;
}
.earth video {
  width: 100%;
  height: 100%;
  display: block;
  clip-path: circle(48.8%);
  filter: brightness(.7) saturate(.78);
}
.earth::before {
  content: "";
  position: absolute;
  inset: 1.25%;
  z-index: -1;
  border-radius: 50%;
  box-shadow: 0 -10px 44px #9679ef66, 0 -2px 13px #d9c6ff;
}
.earth::after {
  content: "";
  position: absolute;
  inset: 1.2%;
  border-radius: 50%;
  background: linear-gradient(#c6aaff29, transparent 18%, #09080e6b 50%, #09080e);
  pointer-events: none;
}
.planet.is-playing .earth { opacity: 1; }
.planet.is-playing > img { opacity: 0; }
@media (max-width: 600px) {
  .planet.is-playing { top: 0; mask-image: none; }
  .earth { top: max(55%, 365px); width: max(120vw, 450px); }
}
</style>
<link rel="stylesheet" href="/waitlist.css">
<script type="module" src="/waitlist.js"></script>
</head>
<body>
<div class="stage">
<main>
<p class="eyebrow">Coming soon</p>
<h1>Join the <em>waitlist.</em></h1>
<p class="description">Government tenders, software, and technology services.</p>
<div id="waitlist-form"></div>
<noscript>Enable JavaScript to join the waitlist.</noscript>
</main>
<div class="planet" aria-hidden="true"><img src="/planet.webp" alt="" width="1585" height="992" fetchpriority="high">
  <!-- Earth photography: NASA EPIC aboard NOAA DSCOVR. Source: https://commons.wikimedia.org/wiki/File:DSCOVR_EPIC_Earth_Rotation.webm -->
  <div class="earth"><video muted loop playsinline preload="none" tabindex="-1"></video></div>
</div>
</div>
</body>
</html>
